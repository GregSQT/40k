[pytest]
# Imports projet (``shared``, ``services``, ``engine``, …) depuis la racine du dépôt.
pythonpath = .
consider_namespace_packages = true
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q --strict-markers --strict-config
markers =
    integration: cross-module tests requiring a running engine
    anomaly: sentinel test tracking a documented known anomaly
