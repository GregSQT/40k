[pytest]
# Imports projet (``shared``, ``services``, ``engine``, …) depuis la racine du dépôt.
pythonpath = .
testpaths = tests
# `tests/` n'a pas d'`__init__.py` : sans cette ligne, un fichier atteint par deux chemins
# d'import existe en DEUX objets module, avec deux caches et deux copies de son état. C'est arrivé
# à `tests/unit/ai/conftest.py`, chargé par le harnais sous `conftest` ET importé par sept tests
# sous `tests.unit.ai.conftest` (mesuré le 2026-08-12). L'option nomme chaque module par son
# chemin complet, donc un fichier = un module, sans avoir à semer 13 `__init__.py`.
consider_namespace_packages = true
python_files = test_*.py
python_functions = test_*
addopts = -q --strict-markers --strict-config
markers =
    integration: cross-module tests requiring a running engine
    anomaly: sentinel test tracking a documented known anomaly
