[pytest]
# Imports projet (``shared``, ``services``, ``engine``, …) depuis la racine du dépôt.
pythonpath = .
testpaths = tests
# `tests/` n'a pas d'`__init__.py` : sans cette ligne, un fichier atteint par deux chemins
# d'import existe en DEUX objets module, avec deux caches et deux copies de son état. C'est arrivé
# à `tests/unit/ai/conftest.py`, chargé par le harnais sous `conftest` ET importé par sept tests
# sous `tests.unit.ai.conftest` (mesuré le 2026-08-12). L'option nomme chaque module par son
# chemin complet, donc un fichier = un module, sans avoir à semer 13 `__init__.py`.
consider_namespace_packages = true
python_files = test_*.py
python_functions = test_*
addopts = -q --strict-markers --strict-config
# GARDE-FOU ANTI-BOUCLE, pas une police de la lenteur — et la distinction fait toute la valeur.
# Ce que ce nombre doit attraper est une boucle INFINIE du moteur, qui dépasse n'importe quelle
# borne finie ; il n'a donc aucune raison d'être serré, et tout intérêt à passer largement au-dessus
# du plus lent test LÉGITIME.
#
# Il vit ICI et non sur la ligne de commande. Mesuré le 2026-08-24 : un `--timeout=30` tapé à la
# main tuait 41 tests d'un coup, tous verts par ailleurs — 41 faux rouges par exécution, pour une
# valeur qu'aucun fichier du dépôt ne déclarait ni ne relisait. Une valeur invisible ne se corrige
# pas, elle se resubit.
#
# CALIBRAGE, mesuré le 2026-08-24 sur cette machine (16 cœurs) :
#   - test légitime le plus lent, ISOLÉ : 74 s
#     (`test_truncated_episodes::test_one_gym_step_is_at_least_one_engine_step`) ;
#   - facteur de contention sous `-n 16 --dist worksteal` : jusqu'à ~4x
#     (34 min CPU pour 2 min 42 d'horloge = 12,6 workers réellement occupés) ;
#   - donc plafond légitime ~300 s, et 600 laisse le facteur 2 de marge qui évite de re-litiger
#     cette ligne à chaque test d'épisode ajouté.
# Ces tests sont des parties réelles (150 à 400 pas moteur, plusieurs graines x deux terrains) :
# leur durée est leur sujet, pas un défaut. Les raccourcir leur retirerait les phases tardives
# (charge, fight) qu'ils existent pour traverser.
timeout = 600
# Une API dépréciée par une dépendance devient un ÉCHEC, pas une ligne du résumé.
# Mesuré le 2026-08-12 : `get_schedule_fn()`/`constant_fn()` étaient dépréciées depuis une version
# majeure entière de SB3 et s'affichaient à chaque exécution de la suite, sans que rien ne les
# traite — un avertissement qu'on apprend à ignorer ne sert plus à rien le jour où la fonction
# disparaît. Le training, lui, ne peut pas jouer ce rôle : il ne les affiche jamais (les appels
# ont lieu au chargement du modèle, et la sortie est noyée). La suite est donc le seul endroit
# où ces avis sont lus.
# Filtre sur le MESSAGE et non sur la catégorie : SB3 lève des `UserWarning` nus
# (stable_baselines3/common/utils.py:166, 193, 212), donc `error::DeprecationWarning`
# n'attraperait rien. Une dépréciation qui apparaît se corrige — elle ne s'exclut pas ici.
# Motif : `(?s)` parce que le message est confronté par `re.match`, où `.` ne franchit PAS un saut
# de ligne — et gymnasium comme SB3 écrivent des avis sur deux lignes. Racine `deprecat` et non
# `is deprecated` : « will be deprecated in v3 » et « deprecation » sont le même avis.
filterwarnings =
    error:(?s).*deprecat
markers =
    integration: cross-module tests requiring a running engine
    anomaly: sentinel test tracking a documented known anomaly
