# Reverse proxy et serveur de fichiers du frontend.
#
# Ce fichier est VERSIONNÉ. Il vivait auparavant en `printf` dans `frontend/Dockerfile` :
# une configuration écrite en lignes échappées ne se relit pas, ne se diffe pas, et la
# complexifier (TLS, en-têtes de sécurité) l'aurait rendue illisible.
#
# TLS (F9) : les certificats ne sont PAS dans l'image, ils sont montés par
# `docker-compose.yml` sous /etc/nginx/certs. nginx refuse de démarrer s'ils manquent, et
# c'est voulu — un démarrage en clair « pour dépanner » est exactement ce que l'étape 5
# ferme. Pour un essai local, générer une paire auto-signée (voir Security.md, étape 5).

# HTTP : ne sert RIEN, redirige tout. Garder un site en clair à côté du site TLS laisserait
# un chemin où le cookie de session voyage en clair — le cookie est `Secure`, donc il ne
# partirait pas, et l'utilisateur constaterait une déconnexion inexplicable plutôt qu'une
# redirection.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Pas de TLS 1.0/1.1 : dépréciés par l'IETF (RFC 8996) et sans utilité pour des
    # navigateurs de test récents.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # Version de nginx retirée des pages d'erreur et de l'en-tête `Server` : elle indique
    # gratuitement quelle pile attaquer.
    server_tokens off;

    # Compression gzip + brotli pour les assets statiques et les réponses API JSON.
    # `gzip_vary on` ajoute `Vary: Accept-Encoding` — indispensable pour que les caches
    # intermédiaires (CDN, proxy) ne servent pas du gzip à un client qui n'en veut pas, et
    # pour que Flask-CORS ne perde pas la trace du header `Accept-Encoding`.
    # Niveau 6 : meilleur ratio CPU/compression ; 1-2 passent plus vite mais compriment peu.
    # Seuil 1 Ko : en-dessous, l'overhead de compression dépasse le gain de bande passante.
    # Brotli (~15-20 % de gain sur JSON vs gzip) : modules chargés via load_module dans
    # /etc/nginx/nginx.conf (contexte main) par le stage brotli-builder du Dockerfile.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        application/json
        application/javascript
        application/x-javascript
        text/html
        text/css
        text/plain
        text/xml
        image/svg+xml
        font/woff
        font/woff2;

    brotli on;
    brotli_static on;
    brotli_comp_level 6;
    brotli_min_length 1024;
    brotli_types
        application/json
        application/javascript
        application/x-javascript
        text/html
        text/css
        text/plain
        text/xml
        image/svg+xml
        font/woff
        font/woff2;

    # HSTS : interdit au navigateur de retenter en clair après une première visite réussie,
    # ce qui ferme la fenêtre de rétrogradation que la redirection 301 laisse ouverte.
    # `max-age` volontairement court (1 jour) tant que le déploiement est en phase de test :
    # une erreur de certificat se corrige alors en un jour, pas en six mois.
    add_header Strict-Transport-Security "max-age=86400" always;
    # Le frontend ne s'affiche jamais dans un cadre : l'interdire ferme le clickjacking.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Lu par `_client_ip()` côté backend pour le rate limiting par (login, IP). Sans lui,
        # tous les utilisateurs partagent l'IP du proxy et cinq essais ratés suffisent à
        # verrouiller n'importe quel compte. Le backend ne l'accepte que depuis une adresse
        # déclarée dans `W40K_TRUSTED_PROXIES` (cf. docker-compose.yml).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Lu par `_request_is_https()` : c'est lui qui décide de l'attribut `Secure` du cookie
        # de session. Le tronçon proxy -> backend étant en clair, le backend ne peut pas
        # déduire seul que le client, lui, est en HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
        # Un tour d'IA ou un chargement de plateau dépasse le défaut de 60 s.
        proxy_read_timeout 180s;
    }
}
